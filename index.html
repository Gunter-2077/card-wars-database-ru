<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Русскоязычная база карт Карточных войн"><title>Карточные войны — база карт</title> <link rel="icon" type="image/png" href="ава.png">
<style>
:root{--bg:#10141c;--panel:#1a202b;--panel2:#232d3d;--text:#f4f6fb;--muted:#aeb9ca;--line:#364154;--accent:#a9ceff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}header{text-align:center;padding:30px 16px 24px;background:#151c27;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(27px,5vw,40px)}header p{color:var(--muted);margin:8px 0 0}main{max-width:1200px;margin:auto;padding:22px 16px 50px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:650}.wide{grid-column:span 2}input,select{width:100%;min-width:0;padding:11px 12px;background:#101722;color:var(--text);border:1px solid #3b4960;border-radius:9px;font:inherit}input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 2px}#count{font-size:14px;color:var(--muted)}.actions{display:flex;align-items:center;gap:8px}button{padding:10px 13px;background:var(--panel2);color:var(--text);border:1px solid #52617a;border-radius:9px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer}.card:hover{border-color:#91b7ee}.art{height:215px;background:radial-gradient(ellipse at top,#354863,#202938 60%,#171c26);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:#dce9ff}.placeholder{padding:20px 12px;border:1px dashed #8297b7;border-radius:10px}.placeholder small{display:block;margin-top:8px;color:#bdcce0}.art img{width:100%;height:100%;object-fit:contain;background:#101722}.body{padding:12px}.body h2{font-size:17px;margin:0 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.chip{background:#2a3546;color:#d7e5fb;border-radius:999px;padding:4px 8px;font-size:12px}.stats{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.effect{font-size:14px;color:#dce2ec;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.note{font-size:13px;color:var(--muted);text-align:center;margin-top:26px}.modal{display:none;position:fixed;inset:0;z-index:5;background:#05070be0;padding:18px;overflow:auto;align-items:center;justify-content:center}.modal.open{display:flex}.modal-inner{position:relative;width:min(760px,100%);padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.modal-inner h2{padding-right:80px}.modal-art{min-height:180px;display:flex;align-items:center;justify-content:center;background:#202938;border-radius:12px;padding:20px;text-align:center}.modal-art img{max-width:100%;max-height:430px;object-fit:contain}.close{position:absolute;right:14px;top:14px}.modal-effect{white-space:pre-wrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:14px 11px 35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:165px}.body{padding:9px}.body h2{font-size:15px}.filters{padding:12px;gap:10px}.toolbar{align-items:flex-start}.actions{width:100%;flex-wrap:wrap}.actions select{flex:1}.wide{grid-column:span 2}}@media(max-width:360px){.grid{grid-template-columns:1fr}.art{height:190px}}
.filters .field:has(#reset){align-self: end;}#reset {width: 100%;min-height: 42px;}
</style></head><body>
<header><h1>Карточные войны</h1><p>Русская база карт · стартовая версия</p></header>
<main>
<section class="filters" aria-label="Поиск и фильтры">
<div class="field wide"><label for="nameSearch">Название карты</label><input id="nameSearch" placeholder="Введите название карты…" autocomplete="off"></div>
<div class="field wide"><label for="effectSearch">Эффект</label><input id="effectSearch" placeholder="Введите слово или фразу из эффекта…" autocomplete="off"></div>
<div class="field"><label for="typeFilter">Тип карты</label><select id="typeFilter"><option value="">Все типы</option><option>Существо</option><option>Заклинание</option><option>Строение</option></select></div>
<div class="field"><label for="landFilter">Тип земли</label><select id="landFilter"><option value="">Все</option><option>Доброземельная</option><option>Болотная</option><option>Лавовая</option><option>Ледяная</option><option>Равнинная</option><option>Кукурузная</option><option>Песчаная</option><option>Радужная</option></select></div>
<div class="field wide"><label for="setFilter">Набор</label><select id="setFilter"><option value="">Все наборы</option></select></div>
<div class="field"><label for="filterCost">Стоимость</label><input id="filterCost" type="number" step="1" placeholder="Любая"></div>
<div class="field"><label for="filterAttack">Атака</label><input id="filterAttack" type="number" step="1" placeholder="Любая"></div>
<div class="field"><label for="filterDefense">Защита</label><input id="filterDefense" type="number" step="1" placeholder="Любая"></div>
<div class="field"><button id="reset" type="button">Сбросить</button></div></section>
<div id="count" aria-live="polite">Найдено карт: 0</div>
<section id="results" class="grid" aria-live="polite"></section><p class="note">Демонстрационные записи — не настоящие карты. Замените их своими данными в массиве cards внутри файла index.html.</p></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-inner"><button class="close" id="closeModal">Закрыть ✕</button><h2 id="modalTitle"></h2><div class="modal-art" id="modalArt"></div>
<div id="modalMeta" class="chips" style="margin-top:12px"></div><div id="modalStats" class="stats"></div><h3>Эффект</h3><p id="modalEffect" class="modal-effect"></p><p id="modalNote" style="font-size:13px;color:var(--muted)"></p></div></div><script>
// Демонстрационные данные. Добавляйте настоящие карты, копируя один объект.
const cards = [
{id: "1",name:"Древний грамотей",type:"Существо",set:"Финн против Джейка",land:"Равнинная",cost:1,attack:1,defense:7,effect:"ФЛЮП >>> Верни случайную радужную карту из твоего сброса себе на руку. Если ты контролируешь строение в этой зоне, получи 1 действие.",image:"Древний грамотей.png",note:"Древний грамотей"},
{id: "2",name: "Архитектор разума",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 2,defense: 6,effect: "Когда Архитектор разума входит в игру, можешь вернуть в подготовленное положение флюпнутое существо под твоим контролем.",image: "Архитектор разума.png",note: "Архитектор разума"},
{id: "3",name: "Барсик Хой",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 2,defense: 6,effect: "Каждое существо, которое переместилось в другую зону в этом ходу, получает +2 к атаке в этот ход.",image: "Барсик Хой.png",note: "Барсик Хой"},
{id: "4",name: "Благо одноглазое",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 2,defense: 5,effect: "ФЛЮП >>> Положи любое заклинание из твоего сброса на верх колоды.",image: "Благо одноглазое.png",note: "Благо одноглазое"},
{id: "5",name: "Велорыцарь",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 3,defense: 4,effect: "Потрать 1 действие >>> Выбранное существо в этой зоне получает -10 к атаке в этот ход.",image: "Велорыцарь.png",note: "Велорыцарь"},
{id: "6",name: "Гномьи сопли",type: "Заклинание",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: null,defense: null,effect: "Возьми 3 карты.",image: "Гномьи сопли.png",note: "Гномьи сопли"},
{id: "7",name: "Джин Стрюзан",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 2,attack: 1,defense: 11,effect: "+2 к атаке за каждое флюпнутое существо под твоим контролем.",image: "Джин Стрюзан.png",note: "Джин Стрюзан"},
{id: "8",name: "Крутой пёс",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 2,attack: 2,defense: 7,effect: "На твоих существ в соседних зонах нельзя нападать.",image: "Крутой пёс.png",note: "Крутой пёс"},
{id: "9",name: "Небесный замок",type: "Строение",set: "Финн против Джейка",land: "Радужная",cost: 1,attack: null,defense: null,effect: "Твои существа в этой зоне получают +3 к защите.",image: "Небесный замок.png",note: "Небесный замок"},
{id: "10",name: "Лапа дракона",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 1,defense: 8,effect: "ФЛЮП >>> Перемести существо под твоим контролем в пустую зону.",image: "Лапа дракона.png",note: "Лапа дракона"},
{id: "11",name: "Прохладный младенец",type: "Существо",set: "Финн против Джейка",land: "Радужная",cost: 0,attack: 1,defense: 2,effect: "+3 к атаке, если соперник не контролирует существо в этой зоне.",image: "Прохладный младенец.png",note: "Прохладный младенец"},
{id: "12",name: "Церебральный кровавый шторм",type: "Заклинание",set: "Финн против Джейка",land: "Радужная",cost: 1,attack: null,defense: null,effect: "Нанеси 1 урон каждому существу под контролем соперника.",image: "Церебральный кровавый.png",note: "Церебральный кровавый шторм"},
{id: "13",name: "Свинья",type: "Существо",set: "Финн против Джейка",land: "Радужная",cost: 1,attack: 1,defense: 4,effect: "ФЛЮП >>> Переверни лицевой стороной вниз выбранное кукурузное поле в этой зоне.",image: "Свинья.png",note: "Свинья"},
{id: "14",name: "Свинюшная кровь",type: "Заклинание",set: "Финн против Джейка",land: "Радужная",cost: 0,attack: null,defense: null,effect: "Каждое существо, которое переместилось в другую зону в этом ходу, получает +2 к атаке в этот ход.",image: "Свинюшная кровь.png",note: "Свинюшная кровь"},
{id: "15",name: "Свинюшный вигвам",type: "Строение",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: null,defense: null,effect: "ФЛЮП >>> Перемести существо из соседней зоны в эту (если она пустая).",image: "Свинюшный ВигВам.png",note: "Свинюшный вигвам"},
{id: "16",name: "Свинюшный вождь",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 2,attack: 2,defense: 10,effect: "+2 к атаке в этот ход за каждое заклинание, которое ты сыграл в этом ходу.",image: "Свинюшный Вождь.png",note: "Свинюшный вождь"},
{id: "17",name: "Свинюшный злопыхатель",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 2,attack: 3,defense: 9,effect: "Когда Свинюшный злопыхатель перемещается в другую зону, бери карту.",image: "Свинюшный злопыхатель.png",note: "Свинюшный злопыхатель"},
{id: "18",name: "Свинюшный талисман",type: "Заклинание",set: "Финн против Джейка",land: "Радужная",cost: 0,attack: null,defense: null,effect: "Выбранное равнинное существо под твоим контролем получает +2 к атаке в этом ходу.",image: "Свинюшный талисман.png",note: "Свинюшный талисман"},
{id: "19",name: "Стеснительный бард",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 2,attack: 1,defense: 5,effect: "ФЛЮП >>> Возьми 1 карту за каждое флюпнутое существо под твоим контролем, включая это.",image: "Стеснительный бард.png",note: "Стеснительный бард"},
{id: "20",name: "Необъятный солдат-дух",type: "Существо",set: "Финн против Джейка",land: "Равнинная",cost: 1,attack: 1,defense: 9,effect: "Каждое соседнее существо получает +1 к атаке.",image: "Необъятный солдат-дух.png",note: "Необъятный солдат-дух"}];
const $=id=>document.getElementById(id);const norm=s=>(s??"").toString().toLocaleLowerCase("ru").trim();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initSets(){const sets=[...new Set(cards.map(c=>c.set).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));$('setFilter').innerHTML='<option value="">Все наборы</option>'+sets.map(s=>`<option>${esc(s)}</option>`).join('');}
function getResults(){const n = norm($('nameSearch').value);const e = norm($('effectSearch').value);const cost = $('filterCost').value.trim();const attack = $('filterAttack').value.trim();const defense = $('filterDefense').value.trim();return cards.filter(c =>(!n || norm(c.name).includes(n)) &&(!e || norm(c.effect).includes(e)) &&(!$('typeFilter').value || c.type === $('typeFilter').value) &&(!$('landFilter').value || c.land === $('landFilter').value) &&(!$('setFilter').value || c.set === $('setFilter').value) &&(cost === '' || (c.cost != null && Number(c.cost) === Number(cost))) &&(attack === '' || (c.attack != null && Number(c.attack) === Number(attack))) &&(defense === '' || (c.defense != null && Number(c.defense) === Number(defense))));}
function art(c){return c.image?`<img src="${esc(c.image)}" alt="Изображение карты ${esc(c.name)}">`:`<div class="placeholder"><strong>${esc(c.name)}</strong><small>Здесь будет изображение карты</small></div>`;}
function render(){const list = getResults();$('count').textContent = `Найдено карт: ${list.length}`;$('results').innerHTML = list.length?list.map(c => `<article class="card" tabindex="0" role="button" data-id="${esc(c.id)}"><div class="art">${art(c)}</div><div class="body"><h2>${esc(c.name)}</h2><div class="chips"><span class="chip">${esc(c.type)}</span><span class="chip">${esc(c.land)}</span></div><div class="stats">${c.cost != null ? `<span>Стоимость: ${esc(c.cost)}</span>` : ''}${c.attack != null ? `<span>Атака: ${esc(c.attack)}</span>` : ''}${c.defense != null ? `<span>Защита: ${esc(c.defense)}</span>` : ''}</div><div class="effect">${esc(c.effect)}</div></div></article>`).join(''):'<div class="empty">Ничего не найдено. Попробуйте изменить запрос или фильтры.</div>';document.querySelectorAll('.card').forEach(el => {const open = () => showCard(el.dataset.id);el.addEventListener('click', open);el.addEventListener('keydown', e => {if (e.key === 'Enter' || e.key === ' ') {e.preventDefault();open();}});});}function showCard(id){const c=cards.find(x=>x.id===id);if(!c)return;$('modalTitle').textContent=c.name;$('modalArt').innerHTML=c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}">`:`<div>${esc(c.name)}<br><small>Добавьте изображение и укажите путь в данных карты.</small></div>`;$('modalMeta').innerHTML=[c.type,c.land,c.set].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');$('modalStats').textContent=[c.cost!=null?`Стоимость: ${c.cost}`:'',c.attack!=null?`Атака: ${c.attack}`:'',c.defense!=null?`Защита: ${c.defense}`:''].filter(Boolean).join(' · ');$('modalEffect').textContent=c.effect||'Эффект не добавлен.';$('modalNote').textContent=c.note||'';$('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open')}
['nameSearch', 'effectSearch'].forEach(id =>$(id).addEventListener('input', render));['filterCost', 'filterAttack', 'filterDefense'].forEach(id =>$(id).addEventListener('input', render));['typeFilter', 'landFilter', 'setFilter'].forEach(id =>$(id).addEventListener('change', render));$('reset').addEventListener('click', () => {['nameSearch', 'effectSearch', 'filterCost', 'filterAttack', 'filterDefense'].forEach(id => $(id).value = '');['typeFilter', 'landFilter', 'setFilter'].forEach(id => $(id).value = '');render();});$('closeModal').addEventListener('click', closeModal);$('modal').addEventListener('click', e => {if (e.target === $('modal')) closeModal();});document.addEventListener('keydown', e => {if (e.key === 'Escape') closeModal();});initSets();render();
</script></body></html>
