const $=id=>document.getElementById(id);const norm=s=>(s??"").toString().toLocaleLowerCase("ru").trim();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initSets(){const sets=[...new Set(cards.map(c=>c.set).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));$('setFilter').innerHTML='<option value="">Все наборы</option>'+sets.map(s=>`<option>${esc(s)}</option>`).join('');}
function getResults(){const n=norm($('nameSearch').value);const e=norm($('effectSearch').value);const cost=$('filterCost').value.trim();const attack=$('filterAttack').value.trim();const defense=$('filterDefense').value.trim();return cards.filter(c=>(!n||norm(c.name).includes(n))&&(!e||norm(c.effect).includes(e))&&(!$('typeFilter').value||c.type===$('typeFilter').value)&&(!$('landFilter').value||c.land===$('landFilter').value)&&(!$('setFilter').value||c.set===$('setFilter').value)&&(cost===''||(c.cost!=null&&Number(c.cost)===Number(cost)))&&(attack===''||(c.attack!=null&&Number(c.attack)===Number(attack)))&&(defense===''||(c.defense!=null&&Number(c.defense)===Number(defense)))).sort((a,b)=>a.name.localeCompare(b.name,'ru'));}
function art(c){return c.image?`<img src="${esc(c.image)}" alt="Изображение карты ${esc(c.name)}">`:`<div class="placeholder"><strong>${esc(c.name)}</strong><small>Здесь будет изображение карты</small></div>`;}
function render(){const list = getResults();$('count').textContent = `Найдено карт: ${list.length}`;$('results').innerHTML = list.length?list.map(c => `<article class="card" tabindex="0" role="button" data-id="${esc(c.id)}"><div class="art">${art(c)}</div><div class="body"><h2>${esc(c.name)}</h2><div class="chips"><span class="chip">${esc(c.type)}</span><span class="chip">${esc(c.land)}</span></div><div class="stats">${c.cost != null ? `<span>Стоимость: ${esc(c.cost)}</span>` : ''}${c.attack != null ? `<span>Атака: ${esc(c.attack)}</span>` : ''}${c.defense != null ? `<span>Защита: ${esc(c.defense)}</span>` : ''}</div><div class="effect">${esc(c.effect)}</div></div></article>`).join(''):'<div class="empty">Ничего не найдено. Попробуйте изменить запрос или фильтры.</div>';document.querySelectorAll('.card').forEach(el => {const open = () => showCard(el.dataset.id);el.addEventListener('click', open);el.addEventListener('keydown', e => {if (e.key === 'Enter' || e.key === ' ') {e.preventDefault();open();}});});}function showCard(id){const c=cards.find(x=>x.id===id);if(!c)return;$('modalTitle').textContent=c.name;$('modalArt').innerHTML=c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}">`:`<div>${esc(c.name)}<br><small>Добавьте изображение и укажите путь в данных карты.</small></div>`;$('modalMeta').innerHTML=[c.type,c.land,c.set].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');$('modalStats').textContent=[c.cost!=null?`Стоимость: ${c.cost}`:'',c.attack!=null?`Атака: ${c.attack}`:'',c.defense!=null?`Защита: ${c.defense}`:''].filter(Boolean).join(' · ');$('modalEffect').textContent=c.effect||'Эффект не добавлен.';$('modalNote').textContent=c.note||'';$('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open')}
['nameSearch', 'effectSearch'].forEach(id =>$(id).addEventListener('input', render));['filterCost', 'filterAttack', 'filterDefense'].forEach(id =>$(id).addEventListener('input', render));['typeFilter', 'landFilter', 'setFilter'].forEach(id =>$(id).addEventListener('change', render));$('reset').addEventListener('click', () => {['nameSearch', 'effectSearch', 'filterCost', 'filterAttack', 'filterDefense'].forEach(id => $(id).value = '');['typeFilter', 'landFilter', 'setFilter'].forEach(id => $(id).value = '');render();});$('closeModal').addEventListener('click', closeModal);$('modal').addEventListener('click', e => {if (e.target === $('modal')) closeModal();});document.addEventListener('keydown', e => {if (e.key === 'Escape') closeModal();});initSets();render();
</script></body></html>
